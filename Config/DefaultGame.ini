[/Script/GameplayAbilities.AbilitySystemGlobals]
; No gameplay cue assets yet; an explicit path keeps GAS from scanning (and warning about) all content.
+GameplayCueNotifyPaths=/Game/GameplayCues

[Hydra]
; Frame cap, applied at game start (AHydraPlayerController). Without a cap two game windows
; on one machine (host mode) both render as fast as they can and Windows starves the one in
; the background (measured: host at 8 fps while the client window had focus), which also
; inflates the measured ping. 0 = no cap.
MaxFPS=120

[/Script/UnrealEd.ProjectPackagingSettings]
; Character models are loaded by path (/Game/Characters/<form>/...), so the cook must be told.
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
